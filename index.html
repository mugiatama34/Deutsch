<title>Werkstatt Deutsch</title>
<meta name="description" content="Einstufungstest und persönlicher Deutschkurs B1–C1 mit türkischen Erklärungen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: technische Zeichnung — ein schmaler Arbeitsbogen mit Schriftfeld je Modul, Fortschritt als Maßkette */
:root {
  --bg: #eceff0;
  --paper: #fbfcfc;
  --ink: #17212b;
  --muted: #5a6670;
  --line: #c6cfd4;
  --accent: #2448a8;
  --accent-soft: #dfe6f7;
  --signal: #d9a400;
  --ok: #2f7d4f;
  --ok-soft: #dcefe3;
  --bad: #b23a2a;
  --bad-soft: #f6e0dc;
  --k-nom: #4b6584;
  --k-akk: #b4442f;
  --k-dat: #2f7d4f;
  --k-gen: #7a4fa0;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --paper: #182029; --ink: #e5eaee; --muted: #9aa6b0; --line: #2e3a46;
    --accent: #8fa9f0; --accent-soft: #1f2b47; --signal: #e8bd2c;
    --ok: #6cc08f; --ok-soft: #173426; --bad: #f08a78; --bad-soft: #3a1d18;
    --k-nom: #9bb3d1; --k-akk: #f08a78; --k-dat: #6cc08f; --k-gen: #c3a1e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --paper: #182029; --ink: #e5eaee; --muted: #9aa6b0; --line: #2e3a46;
  --accent: #8fa9f0; --accent-soft: #1f2b47; --signal: #e8bd2c;
  --ok: #6cc08f; --ok-soft: #173426; --bad: #f08a78; --bad-soft: #3a1d18;
  --k-nom: #9bb3d1; --k-akk: #f08a78; --k-dat: #6cc08f; --k-gen: #c3a1e6;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.6; margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); }
h2 { font-size: 1.9rem; }
h3 { font-size: 1.35rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Kopfleiste */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 920px; margin: 0 auto; padding-inline: 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--f-mono); font-weight: 400; font-size: .7rem; color: var(--muted); letter-spacing: .06em; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav button { background: none; border: 1px solid transparent; border-radius: var(--r); padding: 4px 10px; cursor: pointer; font-family: var(--f-display); font-size: 1.05rem; font-weight: 500; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--ink); border-color: var(--line); background: var(--bg); }
.nav button:hover { color: var(--ink); }

main { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 80px; display: flex; flex-direction: column; gap: 28px; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(16px, 4vw, 32px); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 12px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.tip { border-left: 3px solid var(--signal); padding: 6px 12px; background: color-mix(in srgb, var(--signal) 10%, transparent); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 9px 18px; cursor: pointer; font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; }
.btn:hover { background: var(--accent); border-color: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }

/* Tabellen */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
thead th { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; background: var(--bg); }
.k-nom { color: var(--k-nom); } .k-akk { color: var(--k-akk); } .k-dat { color: var(--k-dat); } .k-gen { color: var(--k-gen); }
th.k-nom, th.k-akk, th.k-dat, th.k-gen { font-family: var(--f-mono); font-size: .78rem; font-weight: 500; white-space: nowrap; }

/* Niveau-Chips */
.lvl { font-family: var(--f-mono); font-size: .75rem; font-weight: 500; border: 1px solid currentColor; border-radius: 2px; padding: 1px 6px; }
.lvl.A2 { color: var(--k-nom); } .lvl.B1 { color: var(--k-dat); } .lvl.B2 { color: var(--accent); } .lvl.C1 { color: var(--k-gen); }

/* Maßkette (Niveau-Skala) */
.scale { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; padding-top: 18px; }
.scale::before { content: ""; position: absolute; left: 0; right: 0; top: 30px; border-top: 1px solid var(--ink); }
.tick { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.tick::before { content: ""; width: 1px; height: 24px; background: var(--ink); }
.tick .pct { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.tick .name { font-family: var(--f-display); font-size: 1.5rem; font-weight: 600; }
.tick.pass .name { color: var(--ok); }
.tick.here::after { content: "IST"; position: absolute; top: -18px; font-family: var(--f-mono); font-size: .65rem; letter-spacing: .1em; background: var(--signal); color: #17212b; padding: 0 5px; border-radius: 2px; }
.tick.goal::after { content: "ZIEL"; position: absolute; top: -18px; font-family: var(--f-mono); font-size: .65rem; letter-spacing: .1em; background: var(--accent); color: var(--paper); padding: 0 5px; border-radius: 2px; }
.bar { height: 6px; width: 70%; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); }
.tick.pass .bar > i { background: var(--ok); }

/* Test */
.qcount { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 3px; background: var(--line); }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.question { font-size: 1.3rem; line-height: 1.45; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 10px 14px; cursor: pointer; display: flex; gap: 12px; align-items: baseline; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt .key { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }

/* Lernplan */
.plan { display: flex; flex-direction: column; }
.week { display: grid; grid-template-columns: 88px 1fr; gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
.week:first-child { border-top: 0; }
.week .wk { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); padding-top: 6px; }
.mods { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mod { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 8px 12px; cursor: pointer; }
.mod:hover { border-color: var(--ink); }
.mod .t { font-family: var(--f-display); font-size: 1.15rem; font-weight: 500; min-width: 0; }
.mod .s { font-family: var(--f-mono); font-size: .72rem; white-space: nowrap; }
.state-gap { color: var(--bad); } .state-done { color: var(--ok); } .state-todo { color: var(--muted); } .state-opt { color: var(--muted); }
.mod.done { background: var(--bg); }

/* Schriftfeld (Modulkopf) */
.titleblock { display: grid; grid-template-columns: 1fr repeat(3, auto); border: 1.5px solid var(--ink); }
.titleblock > div { padding: 8px 12px; border-left: 1px solid var(--ink); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.titleblock > div:first-child { border-left: 0; }
.titleblock .v { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }
.titleblock h2 { font-size: clamp(1.5rem, 4vw, 2.1rem); }
@media (max-width: 560px) {
  .titleblock { grid-template-columns: repeat(3, 1fr); }
  .titleblock > div:first-child { grid-column: 1 / -1; border-bottom: 1px solid var(--ink); }
  .titleblock > div:nth-child(2) { border-left: 0; }
  .week { grid-template-columns: 1fr; gap: 6px; }
}
.examples { display: flex; flex-direction: column; gap: 10px; }
.ex-de { font-weight: 600; }
.ex-tr { color: var(--muted); font-style: italic; font-size: .95rem; }
.exercise { border-top: 1px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.exercise:first-of-type { border-top: 0; padding-top: 0; }
.gaprow { display: flex; gap: 8px; flex-wrap: wrap; }
.gaprow input { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 8px 12px; font-family: var(--f-mono); }
.feedback { font-size: .95rem; padding: 8px 12px; border-radius: var(--r); }
.feedback.ok { background: var(--ok-soft); }
.feedback.no { background: var(--bad-soft); }
.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 20px; }
.vocab div { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); padding-block: 4px; }
.vocab .de { font-weight: 600; }
.vocab .tr { color: var(--muted); font-size: .92rem; }
.art-der { color: var(--accent); } .art-die { color: var(--k-akk); } .art-das { color: var(--k-dat); }
textarea { width: 100%; min-height: 180px; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 12px; line-height: 1.55; resize: vertical; }
.ai-out { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: .96rem; }

/* Karteikarten */
.card { min-height: 190px; border: 1.5px solid var(--ink); border-radius: var(--r); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; background: var(--paper); cursor: pointer; width: 100%; }
.card .big { font-family: var(--f-display); font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 600; line-height: 1.1; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.boxes div { border: 1px solid var(--line); border-radius: var(--r); padding: 6px; text-align: center; display: flex; flex-direction: column; }
.boxes b { font-family: var(--f-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.artbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.artbtns .btn { justify-content: center; font-size: 1.3rem; }

.muted { color: var(--muted); }
.small { font-size: .9rem; }
.hr { border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">Werkstatt Deutsch <small>B1 · B2 · C1</small></div>
    <nav class="nav" id="nav" aria-label="Bereiche">
      <button data-view="home">Übersicht</button>
      <button data-view="test">Einstufung</button>
      <button data-view="plan">Lernplan</button>
      <button data-view="vocab">Wortschatz</button>
    </nav>
  </div>
</header>
